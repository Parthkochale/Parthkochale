name: Daily Chess Puzzle Update

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  update-chess-puzzle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update chess puzzle
        run: python3 .github/scripts/update_chess.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Chess puzzle updated"
          git push
